{
  "schema_version": "1.1",
  "name": "07-neg-offbyone",
  "tags": [
    "negative"
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "Off-by-one here: `for (let i = 0; i <= items.length; i++)`. Fix it.",
    "max_turns": 8,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Edit",
      "Write"
    ]
  },
  "runs": 3,
  "graders": [
    {
      "name": "no-codeswarm-skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "codeswarm",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "no-swarm-vocabulary",
      "type": "regex",
      "pattern": "\\b(swarm|subagents?|fan[- ]?out|workflow script|cost line|agent count)\\b",
      "flags": "i",
      "match": "not_contains",
      "arm": "both"
    },
    {
      "name": "fixed-bound",
      "type": "regex",
      "target": {
        "source": "file",
        "path": "src/items.ts"
      },
      "pattern": "i\\s*<\\s*items\\.length",
      "match": "contains",
      "arm": "both"
    }
  ]
}
