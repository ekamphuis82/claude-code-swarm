{
  "schema_version": "1.1",
  "name": "04-migration-plan",
  "tags": [
    "fire",
    "refactor"
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  },
  "execution": {
    "prompt": "Alle 8 packages in de monorepo gebruiken nog `getUserById`. Moet `findUserById` worden, inclusief tests en mocks — ruim 60 plekken. Hoe pak je dit aan?",
    "max_turns": 20,
    "timeout_seconds": 420,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Edit",
      "Write"
    ]
  },
  "runs": 3,
  "graders": [
    {
      "name": "director-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "swarm-director",
      "min": 1
    },
    {
      "name": "no-write",
      "type": "tool_used",
      "tool": "Write",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "no-edit",
      "type": "tool_used",
      "tool": "Edit",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "discover-transform-verify",
      "type": "llm",
      "criteria": "PASS only if the plan has three distinct stages: discover every call site (including tests and mocks), transform in batches, and an independent verification afterwards (type check, test run, or a separate agent re-checking) that is not done by the same step that made the edits. FAIL if verification is missing or is only \"then run the tests\" folded into the edit step without a distinct stage.",
      "weight": 2
    },
    {
      "name": "fit-line",
      "type": "llm",
      "criteria": "PASS only if the response states whether a multi-agent/parallel approach is worth it for this size of change, with a reason (for example the number of sites or packages versus doing it in one pass). FAIL if no such judgment is made.",
      "weight": 1
    }
  ]
}
