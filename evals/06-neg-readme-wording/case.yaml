{
  "schema_version": "1.1",
  "name": "06-neg-readme-wording",
  "tags": [
    "negative"
  ],
  "context": {},
  "execution": {
    "prompt": "Can you review the wording of this README paragraph? It reads clunky: 'This library provides functionality for the parsing of configuration files which are in the YAML format.'",
    "max_turns": 6,
    "timeout_seconds": 180,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Edit",
      "Write"
    ]
  },
  "runs": 3,
  "graders": [
    {
      "name": "no-codeswarm-skill",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "codeswarm",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "no-swarm-vocabulary",
      "type": "regex",
      "pattern": "\\b(swarm|subagents?|fan[- ]?out|workflow script|cost line|agent count)\\b",
      "flags": "i",
      "match": "not_contains",
      "arm": "both"
    },
    {
      "name": "direct-rewrite",
      "type": "llm",
      "criteria": "PASS only if the response directly offers a tighter rewrite of the sentence (for example \"This library parses YAML configuration files.\") and stays short. FAIL if it asks for a repository, proposes a review process, or talks about agents or costs.",
      "weight": 1
    }
  ]
}
